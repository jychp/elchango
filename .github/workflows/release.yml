name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release ref and current main
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$release_commit" != "$main_commit" ]]; then
            echo "::error::Release commit must exactly match origin/main"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Release tag must use strict SemVer: vX.Y.Z"
              exit 1
            fi
            python3 scripts/validate_versions.py "${RELEASE_TAG#v}"
          elif [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual release validation must run from main"
            exit 1
          else
            python3 scripts/validate_versions.py
          fi

      - name: Read release version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  streamdeck:
    name: Build Stream Deck plugin
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/streamdeck/package-lock.json

      - name: Install Stream Deck dependencies
        run: npm ci
        working-directory: plugins/streamdeck

      - name: Validate and package Stream Deck plugin
        run: make build-plugin-streamdeck

      - name: Create SHA-256 checksum
        id: artifact
        shell: bash
        run: |
          shopt -s nullglob
          packages=(plugins/streamdeck/*.streamDeckPlugin)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one .streamDeckPlugin artifact, found ${#packages[@]}"
            exit 1
          fi
          package="${packages[0]}"
          package_directory="$(dirname "$package")"
          package_name="$(basename "$package")"
          (
            cd "$package_directory"
            sha256sum "$package_name" > "$package_name.sha256"
          )
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload Stream Deck release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamdeck-release
          path: |
            ${{ steps.artifact.outputs.package }}
            ${{ steps.artifact.outputs.package }}.sha256
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Sign and notarize macOS app
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Import Developer ID certificate and API key
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          : "${CERTIFICATE_BASE64:?Missing MACOS_CERTIFICATE_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${API_KEY_BASE64:?Missing APPLE_API_KEY_P8_BASE64}"
          : "${API_KEY_ID:?Missing APPLE_API_KEY_ID}"

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/elchango-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/Developer ID Application/ {print $2; exit}'
          )"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity was imported"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "api-key-path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize, and archive app
        env:
          ELCHANGO_SIGN_MODE: developer-id
          ELCHANGO_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          ELCHANGO_BUILD: ${{ github.run_number }}
          ELCHANGO_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ steps.signing.outputs.api-key-path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          : "${ELCHANGO_TEAM_ID:?Missing APPLE_TEAM_ID environment variable}"
          : "${APPLE_API_ISSUER_ID:?Missing APPLE_API_ISSUER_ID}"
          make notarize-app-macos

      - name: Upload macOS release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: |
            dist/elChango-${{ needs.validate.outputs.version }}-macos-universal.zip
            dist/elChango-${{ needs.validate.outputs.version }}-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/elchango-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs:
      - validate
      - streamdeck
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Dispatch Homebrew Cask update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          : "${GH_TOKEN:?Missing HOMEBREW_TAP_TOKEN}"
          jq -n \
            --arg version "$VERSION" \
            '{
              event_type: "elchango-release",
              client_payload: {
                repository: "jychp/elchango",
                version: $version
              }
            }' |
            gh api \
              --method POST \
              repos/jychp/homebrew-tap/dispatches \
              --input -
