version: 2

updates:
  - package-ecosystem: swift
    directory: /macos-app
    schedule:
      interval: weekly
      day: monday
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 4
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      swift-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 4
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /plugins/streamdeck
    schedule:
      interval: weekly
      day: monday
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 4
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      streamdeck-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /.github/tools/claude-validator
    schedule:
      interval: weekly
      day: monday
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 4
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
